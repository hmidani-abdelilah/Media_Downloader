name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage-x86_64:
    name: Build Media Downloader AppImage (x86_64)
    # تم التحديث إلى 22.04 لحل مشكلة تعليق الخادم العالق
    runs-on: ubuntu-22.04

    env:
      APP_NAME: Media_Downloader
      APP_ID: io.github.hmidani_abdelilah.Media_Downloader
      ARCH: x86_64
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
      ARIA2_URL: https://github.com/dmesg00/aria2-static-builds/releases/download/v1.37.0/aria2-1.37.0-linux-gnu-64bit-build1.tar.bz2
      ARIA2_SHA256: 80c0a04aabaedf1f3cf8ec77861547823b7ecc317fb61220b06c28edf97bb964
      LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl jq file xz-utils bzip2 tar desktop-file-utils \
            python3-pip python3-venv appstream libgl1-mesa-glx wget

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="3.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          # تثبيت إصدار بايثون مستقر لضمان بناء مكاتب متوافقة
          python-version: '3.10'

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Compile Application with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "${{ env.APP_NAME }}" \
            --icon=asset/Icon.ico \
            --collect-all typeguard \
            --collect-all CTkFileDialog \
            --collect-all customtkinter \
            --collect-all yt_dlp \
            --add-data "languages:languages" \
            --collect-submodules PIL \
            --add-data "asset:asset" \
            --add-data="asset/Icon.ico:asset" \
            app.py

      - name: Setup AppDir Structure
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf AppDir build/downloads
          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps \
            AppDir/usr/share/metainfo \
            build/downloads

          cp -r dist/${{ env.APP_NAME }}/* AppDir/usr/bin/

          cp Media_Downloader.desktop AppDir/usr/share/applications/${{ env.APP_ID }}.desktop
          cp Media_Downloader.desktop AppDir/

          ICON="icon.png"
          cp "$ICON" AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png
          cp "$ICON" AppDir/${{ env.APP_NAME }}.png
          cp "$ICON" AppDir/.DirIcon

          cp Media_Downloader.appdata.xml AppDir/usr/share/metainfo/${{ env.APP_ID }}.appdata.xml

      - name: Bundle FFmpeg and ffprobe
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 "$FFMPEG_URL" -o build/downloads/ffmpeg.tar.xz
          mkdir -p build/ffmpeg
          tar -xJf build/downloads/ffmpeg.tar.xz -C build/ffmpeg --strip-components=1
          install -m 0755 build/ffmpeg/bin/ffmpeg AppDir/usr/bin/ffmpeg
          install -m 0755 build/ffmpeg/bin/ffprobe AppDir/usr/bin/ffprobe

      - name: Bundle static aria2c
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 "$ARIA2_URL" -o build/downloads/aria2.tar.bz2
          echo "$ARIA2_SHA256  build/downloads/aria2.tar.bz2" | sha256sum -c -
          mkdir -p build/aria2
          tar -xjf build/downloads/aria2.tar.bz2 -C build/aria2 --strip-components=1
          ARIA2_BIN="$(find build/aria2 -type f -name aria2c -perm -111 | head -n1)"
          install -m 0755 "$ARIA2_BIN" AppDir/usr/bin/aria2c

      - name: Build AppImage using LinuxDeploy
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 "$LINUXDEPLOY_URL" -o linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          VERSION="${{ steps.version.outputs.version }}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --desktop-file Media_Downloader.desktop --output appimage
          
          OUTPUT="Media_Downloader-${VERSION}-x86_64.AppImage"
          mv Media_Downloader-x86_64.AppImage "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-AppImage-x86_64
          path: |
            Media_Downloader-*.AppImage
            Media_Downloader-*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish AppImage on GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Media_Downloader-*.AppImage
            Media_Downloader-*.AppImage.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
