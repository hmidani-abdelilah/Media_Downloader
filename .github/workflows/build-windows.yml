name: Build Windows Release

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من موقع GitHub
  push:
    tags:
      - 'v*' # سيعمل تلقائياً عند نشر أي إصدار يحمل تاغ مثل v3.0.0

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Media Downloader (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Compile Windows with PyInstaller
        # أمر التجميع الخاص بك مع استخدام الفواصل المنقوطة الخاصة بويندوز
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Media_Downloader" --icon=asset/Icon.ico --collect-all typeguard --collect-all CTkFileDialog --collect-all customtkinter --collect-all yt_dlp --add-data "languages;languages" --collect-submodules PIL --add-data "asset;asset" --add-data "asset/Icon.ico;asset" app.py

      - name: Determine version and Compress into ZIP
        shell: bash
        run: |
          # استخراج رقم الإصدار بشكل نظيف للفرز
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="3.0.0"
          fi
          
          # الدخول لمجلد التجميع وضغط المخرجات عبر PowerShell المدمج في بيئة bash للـ Actions
          cd dist
          powershell Compress-Archive -Path "Media_Downloader" -DestinationPath "../Media_Downloader-${VERSION}-Windows.zip"

      - name: Publish Binaries to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Media_Downloader-*-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
